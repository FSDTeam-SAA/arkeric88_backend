<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test Payment</title>
    <style>
      :root{--bg:#f3f1ed;--card:#fff;--accent:#4f5949;}
      body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#efede9, #f7f6f4);min-height:100vh;display:flex;align-items:center;justify-content:center}
      .wrap{width:420px;background:var(--card);border-radius:10px;padding:22px;box-shadow:0 8px 30px rgba(23,23,23,0.08)}
      h2{margin:0 0 8px;color:#222;font-size:20px}
      label{display:block;font-size:13px;color:#444;margin-top:12px}
      input[type=text], input[type=number], select{width:100%;padding:10px;border:1px solid #e6e2dd;border-radius:6px;margin-top:6px;box-sizing:border-box}
      #card-element{min-height:48px;padding:12px;border:1px solid #e6e2dd;border-radius:6px;margin-top:6px;background:#fff}
      .row{display:flex;gap:10px}
      .row > *{flex:1}
      button{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer}
      .muted{font-size:13px;color:#666;margin-top:8px}
      .notice{font-size:13px;padding:8px;background:#f8faf8;border-radius:6px;margin-top:10px;color:#224}
      .result{margin-top:14px;padding:10px;border-radius:6px}
      .success{background:#e6faf0;border:1px solid #b6f0cf;color:#064}
      .error{background:#fff1f1;border:1px solid #f2c2c2;color:#900}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Test Payment</h2>

      <label>Backend base URL
        <input id="backendUrl" type="text" value="http://localhost:5000/api/v1" />
      </label>

      <label>Amount (major unit, e.g. 2.50)
        <input id="amount" type="number" step="0.01" value="2.00" />
      </label>

      <label>Description
        <input id="description" type="text" value="Test one-time payment" />
      </label>

      <label>Name on Card
        <input id="nameOnCard" type="text" value="John Doe" />
      </label>

      <div class="row">
        <div>
          <label>Country
            <input id="country" type="text" value="US" />
          </label>
        </div>
        <div>
          <label>ZIP Code
            <input id="zipCode" type="text" value="12345" />
          </label>
        </div>
      </div>

      <label>Card details
        <div id="card-element"></div>
      </label>

      <button id="pay" type="button">Pay Now</button>

      <div class="muted">Test cards: <strong>4242 4242 4242 4242</strong> — any future expiry, any CVC (e.g. 123).</div>

      <div id="result" class="result" style="display:none"></div>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
      // Minimal Stripe Elements test harness.
      // Steps:
      // 1) Enter backend URL (default http://localhost:3000/api/v1)
      // 2) Set amount, name, country, zip as you like
      // 3) Click Pay Now — page will request a payment intent from your backend
      // 4) The backend must return { message, data: { clientSecret, publishableKey, paymentIntentId, paymentId } }

      const payButton = document.getElementById('pay');
      const backendInput = document.getElementById('backendUrl');
      const amountInput = document.getElementById('amount');
      const descInput = document.getElementById('description');
      const nameInput = document.getElementById('nameOnCard');
      const countryInput = document.getElementById('country');
      const zipInput = document.getElementById('zipCode');
      const resultEl = document.getElementById('result');

      let stripe = null;
      let card = null;
      let clientSecret = null;
      let paymentIntentCreated = false;

      function showResult(message, ok = true) {
        resultEl.style.display = 'block';
        resultEl.className = 'result ' + (ok ? 'success' : 'error');
        resultEl.textContent = message;
      }

      function resetResult() {
        resultEl.style.display = 'none';
        resultEl.textContent = '';
      }

      function mountCardElement(publishableKey) {
        if (stripe && card) return; // already mounted
        stripe = Stripe(publishableKey);
        const elements = stripe.elements();
        card = elements.create('card', { style: { base: { fontSize: '16px' } } });
        card.mount('#card-element');
      }

      async function createPaymentIntent() {
        resetResult();
        payButton.disabled = true;
        const backend = backendInput.value.replace(/\/$/, '');
        const payload = {
          amount: parseFloat(amountInput.value || '0'),
          currency: 'usd',
          description: descInput.value,
          nameOnCard: nameInput.value,
          country: countryInput.value,
          zipCode: zipInput.value,
        };

        try {
          const r = await fetch(backend + '/payments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const json = await r.json();
          if (!r.ok) {
            throw new Error((json && json.message) || 'Failed to create payment intent');
          }

          // Support backend returning either { message, data: {...} } or direct object
          const data = json.data || json;
          clientSecret = data.clientSecret || data.client_secret;
          const publishableKey = data.publishableKey || data.publishable_key || data.publishable_key;

          if (!clientSecret || !publishableKey) {
            throw new Error('Backend did not return clientSecret or publishableKey');
          }

          mountCardElement(publishableKey);
          paymentIntentCreated = true;
          payButton.textContent = 'Submit payment';
          showResult('Payment intent created. Enter your card details and click Submit payment.', true);
        } catch (err) {
          console.error(err);
          showResult(err.message || 'Unexpected error', false);
        } finally {
          payButton.disabled = false;
        }
      }

      async function confirmCardPayment() {
        resetResult();
        payButton.disabled = true;

        try {
          const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
            payment_method: {
              card: card,
              billing_details: { name: nameInput.value },
            },
          });

          if (error) {
            showResult('Payment failed: ' + error.message, false);
          } else if (paymentIntent && paymentIntent.status === 'succeeded') {
            showResult('Payment successful — status: ' + paymentIntent.status, true);
            payButton.textContent = 'Pay Now';
            paymentIntentCreated = false;
            clientSecret = null;
          } else {
            showResult('Payment status: ' + (paymentIntent && paymentIntent.status), false);
          }
        } catch (err) {
          console.error(err);
          showResult(err.message || 'Unexpected error', false);
        } finally {
          payButton.disabled = false;
        }
      }

      payButton.addEventListener('click', (e) => {
        e.preventDefault();
        if (!paymentIntentCreated) {
          createPaymentIntent();
        } else {
          confirmCardPayment();
        }
      });
    </script>
  </body>
</html>
