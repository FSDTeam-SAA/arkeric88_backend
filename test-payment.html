<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test Payment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root{--bg:#f3f1ed;--card:#fff;--accent:#4f5949;}
      body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#efede9, #f7f6f4);min-height:100vh;display:flex;align-items:center;justify-content:center}
      .wrap{width:420px;background:var(--card);border-radius:10px;padding:22px;box-shadow:0 8px 30px rgba(23,23,23,0.08)}
      h2{margin:0 0 8px;color:#222;font-size:20px}
      label{display:block;font-size:13px;color:#444;margin-top:12px}
      input[type=text], input[type=number], select{width:100%;padding:10px;border:1px solid #e6e2dd;border-radius:6px;margin-top:6px;box-sizing:border-box}
      #card-element{min-height:48px;padding:12px;border:1px solid #e6e2dd;border-radius:6px;margin-top:6px;background:#fff}
      .row{display:flex;gap:10px}
      .row > *{flex:1}
      button{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer}
      button:disabled{opacity:0.5;cursor:not-allowed}
      .muted{font-size:13px;color:#666;margin-top:8px}
      .notice{font-size:13px;padding:8px;background:#f8faf8;border-radius:6px;margin-top:10px;color:#224}
      .result{margin-top:14px;padding:10px;border-radius:6px}
      .success{background:#e6faf0;border:1px solid #b6f0cf;color:#064}
      .error{background:#fff1f1;border:1px solid #f2c2c2;color:#900}
      .hidden{display:none !important}

      /* ─── QUIZ (Velari-style multi-step) ───────────────────────────── */
      .quiz-overlay{
        position:fixed; inset:0; z-index:1000;
        background:#f5f1ea;
        display:flex; flex-direction:column;
        font-family:Inter,system-ui,Arial,sans-serif;
      }
      .quiz-header{
        display:flex; align-items:center; justify-content:space-between;
        padding:26px 44px;
      }
      .quiz-back, .quiz-save{
        all:unset; cursor:pointer; font-size:13px; color:#7a7468;
        padding:6px 8px; border-radius:6px;
      }
      .quiz-back:hover, .quiz-save:hover{ color:#4a463d; }
      .quiz-back:disabled{ opacity:0; cursor:default; pointer-events:none; }
      .quiz-logo{
        display:flex; align-items:center; gap:8px;
        font-family:'Playfair Display',Georgia,serif;
        font-size:18px; letter-spacing:2px; color:#3a3730;
      }
      .quiz-logo svg{ width:18px; height:18px; color:#b8935b; }
      .quiz-body{
        flex:1; display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        padding:10px 28px; text-align:center;
      }
      .quiz-progress{
        font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
        color:#a39d8e; margin-bottom:16px;
      }
      .quiz-question{
        font-family:'Playfair Display',Georgia,serif;
        font-weight:500; font-size:28px; line-height:1.32;
        color:#2c2a24; max-width:520px; margin:0 0 38px;
      }
      .quiz-options{
        display:grid; gap:12px; width:100%; max-width:520px;
      }
      .quiz-options.cols-2{ grid-template-columns:repeat(2,1fr); }
      .quiz-options.cols-3{ grid-template-columns:repeat(3,1fr); }
      .quiz-options.cols-4{ grid-template-columns:repeat(4,1fr); max-width:680px; }
      .quiz-option{
        all:unset; cursor:pointer;
        display:flex; align-items:center; gap:10px;
        border:1px solid #e4ded2; background:#fff; border-radius:8px;
        padding:14px 16px; font-size:14px; color:#3a3730;
        text-align:left; transition:border-color .15s ease, background .15s ease;
        box-sizing:border-box;
      }
      .quiz-option:hover{ border-color:#cdc4b2; }
      .quiz-option.selected{ border-color:#4f5949; background:#f2f6f0; }
      .quiz-option svg{ width:16px; height:16px; flex-shrink:0; color:#8a8475; }
      .quiz-option.selected svg{ color:#4f5949; }
      .quiz-option-title{ font-weight:600; }
      .quiz-options.cols-4 .quiz-option{
        flex-direction:column; align-items:flex-start; gap:8px;
      }
      .quiz-option-desc{ font-size:12px; color:#938c7c; line-height:1.4; }
      .quiz-footer{
        padding:22px 44px 44px; display:flex; justify-content:center;
      }
      .quiz-continue{
        all:unset; cursor:pointer;
        background:var(--accent); color:#fff; font-weight:600; font-size:14px;
        padding:14px 36px; border-radius:24px;
        display:inline-flex; align-items:center; gap:8px;
        transition:opacity .15s ease;
      }
      .quiz-continue:disabled{ opacity:.4; cursor:not-allowed; }
      @media (max-width:640px){
        .quiz-header{ padding:20px 20px; }
        .quiz-question{ font-size:22px; }
        .quiz-options.cols-2, .quiz-options.cols-3, .quiz-options.cols-4{ grid-template-columns:1fr 1fr; max-width:420px; }
        .quiz-footer{ padding:18px 20px 32px; }
      }
    </style>
  </head>
  <body>
    <!-- ─── QUIZ OVERLAY ────────────────────────────────────────────── -->
    <div id="quizSection" class="quiz-overlay">
      <div class="quiz-header">
        <button id="quizBack" class="quiz-back" type="button">← Back</button>
        <div class="quiz-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21c-4-2.5-7-6-7-10A7 7 0 0 1 12 3a7 7 0 0 1 7 8c0 4-3 7.5-7 10z"/></svg>
          VELARI
        </div>
        <button id="quizSave" class="quiz-save" type="button">Save &amp; Exit</button>
      </div>

      <div class="quiz-body">
        <div class="quiz-progress" id="quizProgress"></div>
        <h1 class="quiz-question" id="quizQuestionText"></h1>
        <div class="quiz-options" id="quizOptions"></div>
      </div>

      <div class="quiz-footer">
        <button id="continueBtn" class="quiz-continue" type="button" disabled>Continue →</button>
      </div>
    </div>

    <div class="wrap">
      <!-- ─── PAYMENT SECTION ─────────────────────────────────────────── -->
      <div id="paymentSection" class="hidden">
        <h2>Test Payment</h2>

        <label>Backend base URL
          <input id="backendUrl" type="text" value="http://localhost:5000/api/v1" />
        </label>

        <label>Amount (major unit, e.g. 2.50)
          <input id="amount" type="number" step="0.01" value="2.00" />
        </label>

        <label>Description
          <input id="description" type="text" value="Test one-time payment" />
        </label>

        <label>Name on Card
          <input id="nameOnCard" type="text" value="John Doe" />
        </label>

        <div class="row">
          <div>
            <label>Country
              <input id="country" type="text" value="US" />
            </label>
          </div>
          <div>
            <label>ZIP Code
              <input id="zipCode" type="text" value="12345" />
            </label>
          </div>
        </div>

        <label>Card details
          <div id="card-element"></div>
        </label>

        <button id="pay" type="button">Pay Now</button>

        <div class="muted">Test cards: <strong>4242 4242 4242 4242</strong> — any future expiry, any CVC (e.g. 123).</div>

        <div id="result" class="result" style="display:none"></div>
      </div>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
      // ─── Quiz configuration ───────────────────────────────────────────
      const ICONS = {
        cloud:   '<path d="M17.5 19H9a5 5 0 1 1 .5-9.9 6 6 0 0 1 11.6 2.1A4 4 0 0 1 17.5 19z"/>',
        smile:   '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
        zap:     '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        compass: '<circle cx="12" cy="12" r="9"/><polygon points="16 8 13.5 13.5 8 16 10.5 10.5 16 8"/>',
        sparkle: '<path d="M12 3l1.6 4.9L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.1z"/>',
        dots:    '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
        moon:    '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
        heart:   '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
        star:    '<polygon points="12 2 15 9 22 9.5 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.5 9 9"/>',
        wind:    '<path d="M9.5 4.5a2.5 2.5 0 1 1 2 4H2"/><path d="M14 9.5a2.5 2.5 0 1 1 2 4H2"/><path d="M11 19.5a2.5 2.5 0 1 0 2-4H2"/>',
        feather: '<path d="M20.2 12.2a6 6 0 0 0-8.4-8.4L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/>',
        flame:   '<path d="M12 2s5 5.2 5 10a5 5 0 0 1-10 0c0-1.8.8-2.9.8-2.9s.6 1.4 1.6 1.4c0-2.6-2.4-4.3-2.4-7.1 0 0 1.8.9 1.8 2.6 0-2.6 3.2-3.6 3.2-4z"/>',
        bolt:    '<polygon points="13 2 4 13 11 13 10 22 20 11 13 11 13 2"/>',
        user:    '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
        couple:  '<circle cx="8.5" cy="8" r="3"/><circle cx="15.5" cy="8" r="3"/><path d="M2 21v-1a6 6 0 0 1 9-5.2"/><path d="M22 21v-1a6 6 0 0 0-9-5.2"/>',
        group:   '<circle cx="8" cy="8" r="2.6"/><circle cx="16" cy="8" r="2.6"/><circle cx="12" cy="14" r="2.6"/><path d="M2 21c0-2.8 2.4-4.6 6-4.6"/><path d="M22 21c0-2.8-2.4-4.6-6-4.6"/>',
        home:    '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'
      };

      function iconSvg(name){
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
      }

      const QUIZ_QUESTIONS = [
        {
          question: 'How are you feeling today?',
          layout: 'cols-2',
          options: [
            { label: 'Overwhelmed', icon: 'cloud' },
            { label: 'Calm', icon: 'smile' },
            { label: 'Stressed', icon: 'zap' },
            { label: 'Adventurous', icon: 'compass' },
            { label: 'Inspired', icon: 'sparkle' },
            { label: 'Other', icon: 'dots' },
          ]
        },
        {
          question: 'What kind of experience is calling to you?',
          layout: 'cols-3',
          options: [
            { label: 'Deep Rest', icon: 'moon' },
            { label: 'Inner Peace', icon: 'heart' },
            { label: 'Celebration', icon: 'star' },
            { label: 'Exploration', icon: 'compass' },
            { label: 'Escape', icon: 'wind' },
            { label: 'Spiritual', icon: 'sparkle' },
          ]
        },
        {
          question: "What's your energy like for this trip?",
          layout: 'cols-3',
          options: [
            { label: 'Low', icon: 'feather' },
            { label: 'Medium', icon: 'flame' },
            { label: 'High', icon: 'bolt' },
          ]
        },
        {
          question: 'How do you want to experience this journey?',
          layout: 'cols-4',
          options: [
            { label: 'Solo', desc: 'Just me and my thoughts', icon: 'user' },
            { label: 'Couple', desc: 'An intimate shared experience', icon: 'couple' },
            { label: 'Small Group', desc: '2–6 close companions', icon: 'group' },
            { label: 'Family', desc: 'Travel with loved ones', icon: 'home' },
          ]
        },
      ];

      // ─── DOM refs ────────────────────────────────────────────────────
      const quizSection = document.getElementById('quizSection');
      const quizProgress = document.getElementById('quizProgress');
      const quizQuestionText = document.getElementById('quizQuestionText');
      const quizOptionsEl = document.getElementById('quizOptions');
      const continueBtn = document.getElementById('continueBtn');
      const quizBackBtn = document.getElementById('quizBack');
      const quizSaveBtn = document.getElementById('quizSave');
      const paymentSection = document.getElementById('paymentSection');

      const payButton = document.getElementById('pay');
      const backendInput = document.getElementById('backendUrl');
      const amountInput = document.getElementById('amount');
      const descInput = document.getElementById('description');
      const nameInput = document.getElementById('nameOnCard');
      const countryInput = document.getElementById('country');
      const zipInput = document.getElementById('zipCode');
      const resultEl = document.getElementById('result');

      let stripe = null;
      let card = null;
      let clientSecret = null;
      let paymentIntentCreated = false;

      let currentQuestion = 0;
      const quizSelections = new Array(QUIZ_QUESTIONS.length).fill(null);

      // ─── Render current quiz question ────────────────────────────────
      function renderQuestion() {
        const q = QUIZ_QUESTIONS[currentQuestion];

        quizProgress.textContent = 'QUESTION ' + (currentQuestion + 1) + ' OF ' + QUIZ_QUESTIONS.length;
        quizQuestionText.textContent = q.question;

        quizOptionsEl.className = 'quiz-options ' + q.layout;
        quizOptionsEl.innerHTML = '';

        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'quiz-option' + (quizSelections[currentQuestion] === i ? ' selected' : '');
          btn.innerHTML = iconSvg(opt.icon) +
            '<span class="quiz-option-text">' +
              '<span class="quiz-option-title">' + opt.label + '</span>' +
              (opt.desc ? '<span class="quiz-option-desc">' + opt.desc + '</span>' : '') +
            '</span>';
          btn.addEventListener('click', () => {
            quizSelections[currentQuestion] = i;
            renderQuestion();
          });
          quizOptionsEl.appendChild(btn);
        });

        quizBackBtn.disabled = currentQuestion === 0;
        continueBtn.disabled = quizSelections[currentQuestion] === null;
        continueBtn.textContent = currentQuestion === QUIZ_QUESTIONS.length - 1 ? 'Continue to Payment →' : 'Continue →';
      }

      function getQuizAnswers() {
        return QUIZ_QUESTIONS.map((q, i) => ({
          question: q.question,
          answer: quizSelections[i] === null ? '' : q.options[quizSelections[i]].label,
        }));
      }

      // ─── Quiz navigation ──────────────────────────────────────────────
      continueBtn.addEventListener('click', () => {
        if (quizSelections[currentQuestion] === null) return;

        if (currentQuestion < QUIZ_QUESTIONS.length - 1) {
          currentQuestion += 1;
          renderQuestion();
        } else {
          quizSection.classList.add('hidden');
          paymentSection.classList.remove('hidden');
        }
      });

      quizBackBtn.addEventListener('click', () => {
        if (currentQuestion > 0) {
          currentQuestion -= 1;
          renderQuestion();
        }
      });

      quizSaveBtn.addEventListener('click', () => {
        // Placeholder: no persistence backend wired up yet.
        console.log('Quiz progress saved:', getQuizAnswers());
      });

      // ─── Payment helpers ─────────────────────────────────────────────
      function showResult(message, ok = true) {
        resultEl.style.display = 'block';
        resultEl.className = 'result ' + (ok ? 'success' : 'error');
        resultEl.textContent = message;
      }

      function resetResult() {
        resultEl.style.display = 'none';
        resultEl.textContent = '';
      }

      function mountCardElement(publishableKey) {
        if (stripe && card) return;
        stripe = Stripe(publishableKey);
        const elements = stripe.elements();
        card = elements.create('card', { style: { base: { fontSize: '16px' } } });
        card.mount('#card-element');
      }

      async function createPaymentIntent() {
        resetResult();
        payButton.disabled = true;
        const backend = backendInput.value.replace(/\/$/, '');
        const quizData = getQuizAnswers();
        const payload = {
          amount: parseFloat(amountInput.value || '0'),
          currency: 'usd',
          description: descInput.value,
          nameOnCard: nameInput.value,
          country: countryInput.value,
          zipCode: zipInput.value,
          quiz: quizData,
        };

        try {
          const r = await fetch(backend + '/payments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const json = await r.json();
          if (!r.ok) {
            throw new Error((json && json.message) || 'Failed to create payment intent');
          }

          console.log('Payment intent response:', json);

          const data = json.data || json;
          clientSecret = data.clientSecret || data.client_secret;
          const publishableKey = data.publishableKey || data.publishable_key || data.publishable_key;

          if (!clientSecret || !publishableKey) {
            throw new Error('Backend did not return clientSecret or publishableKey');
          }

          mountCardElement(publishableKey);
          paymentIntentCreated = true;
          payButton.textContent = 'Submit payment';
          showResult('Payment intent created. Enter your card details and click Submit payment.', true);
        } catch (err) {
          console.error(err);
          showResult(err.message || 'Unexpected error', false);
        } finally {
          payButton.disabled = false;
        }
      }

      async function confirmCardPayment() {
        resetResult();
        payButton.disabled = true;

        try {
          const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
            payment_method: {
              card: card,
              billing_details: { name: nameInput.value },
            },
          });

          if (error) {
            showResult('Payment failed: ' + error.message, false);
          } else if (paymentIntent && paymentIntent.status === 'succeeded') {
            console.log('Payment succeeded:', paymentIntent);
            showResult('Payment successful — status: ' + paymentIntent.status, true);
            payButton.textContent = 'Pay Now';
            paymentIntentCreated = false;
            clientSecret = null;
          } else {
            showResult('Payment status: ' + (paymentIntent && paymentIntent.status), false);
          }
        } catch (err) {
          console.error(err);
          showResult(err.message || 'Unexpected error', false);
        } finally {
          payButton.disabled = false;
        }
      }

      payButton.addEventListener('click', (e) => {
        e.preventDefault();
        if (!paymentIntentCreated) {
          createPaymentIntent();
        } else {
          confirmCardPayment();
        }
      });

      // ─── Init ────────────────────────────────────────────────────────
      renderQuestion();
    </script>
  </body>
</html>
